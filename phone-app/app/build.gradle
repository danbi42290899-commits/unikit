apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.unikit.phone"

    compileSdk = 34

    defaultConfig {
        applicationId "com.unikit.phone"
        // Runs on an actual Android phone (not Glass EE2's fixed API 27),
        // so this targets a normal modern range instead of pinning to old
        // hardware -- contrast with glass-app/app/build.gradle.
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0-phone-registration-carousel"

        // Same pattern as glass-app/network/UniHubConfig.kt: one place to
        // repoint the app at a different UNI-HUB without touching code.
        // Current dev setup: Pi + Phone + Glass all join the same personal
        // mobile hotspot, and the Pi's address on that hotspot is
        // 10.18.168.235 -- see pi/README.md. (Not the pi/setup_ap.sh
        // Pi-hosted-AP mode, which uses 10.42.0.1; that's a separate,
        // still-valid future deployment path, not what's active today.)
        buildConfigField "String", "UNI_HUB_HOST", "\"10.18.168.235\""
        buildConfigField "int", "UNI_HUB_PORT", "8000"
    }

    buildFeatures {
        buildConfig true
        viewBinding false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Camera capture -- handles lifecycle/rotation/backpressure so this
    // doesn't need to be hand-rolled on top of raw Camera2.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // WebSocket client for /ws/camera, same library glass-app uses for
    // /ws/telemetry and /ws/control so both apps share one networking
    // dependency choice.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    // Multi-screen navigation (plain Fragment + manual FragmentManager
    // transactions -- no Navigation Component, see
    // ~/.claude/plans/curious-floating-flame.md #1/#5) and the
    // Material Components theme/widgets for the exam-workflow UI.
    // Versions pinned to whatever's already in ~/.gradle's offline cache.
    implementation "androidx.fragment:fragment:1.5.4"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.1.0"
}
