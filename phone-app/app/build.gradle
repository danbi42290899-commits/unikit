apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.unikit.phone"

    compileSdk = 34

    defaultConfig {
        applicationId "com.unikit.phone"
        // Runs on an actual Android phone (not Glass EE2's fixed API 27),
        // so this targets a normal modern range instead of pinning to old
        // hardware -- contrast with glass-app/app/build.gradle.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-phase3"

        // Same pattern as glass-app/network/UniHubConfig.kt: one place to
        // repoint the app at a different UNI-HUB without touching code.
        // 10.42.0.1 is NetworkManager's fixed gateway address when the Pi
        // runs pi/setup_ap.sh (ipv4.method=shared) -- see pi/README.md.
        buildConfigField "String", "UNI_HUB_HOST", "\"10.42.0.1\""
        buildConfigField "int", "UNI_HUB_PORT", "8000"
    }

    buildFeatures {
        buildConfig true
        viewBinding false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Camera capture -- handles lifecycle/rotation/backpressure so this
    // doesn't need to be hand-rolled on top of raw Camera2.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // WebSocket client for /ws/camera, same library glass-app uses for
    // /ws/telemetry and /ws/control so both apps share one networking
    // dependency choice.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
}
